<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERIS Ground Station - Dashboard</title>
    <script src="vendor/vue.global.js"></script>
    <script src="vendor/chart.min.js"></script>
    <script src="vendor/hammer.min.js"></script>
    <script src="vendor/chartjs-plugin-zoom.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>ERIS Delta Ground Station</h1>
            <div class="connection-status" :class="connectionStatus">
                {{ connectionText }}
            </div>
        </header>

        <div class="controls">

            <button @click="reconnect">Reconnect</button>
        </div>

        <div class="session-controls">
            <div class="session-info">
                <span class="info-label">Session Active</span>
                <span class="info-item">{{ getTotalPackets() }} packets</span>
            </div>
            <div class="session-actions">
                <button @click="clearCharts" class="btn-clear">Clear Charts</button>
                <button @click="saveFlight" class="btn-save">Save Flight</button>
            </div>
        </div>

        <!-- Manual Timer -->
        <div class="manual-timer-container">
            <div class="manual-timer">
                <h2 class="timer-title">Timer</h2>
                <div class="timer-display" v-if="!manualTimerEditing" @click="editManualTimer">
                    {{ formatTimer(manualTimer) }}
                </div>
                <input
                    v-else
                    id="manual-timer-input"
                    type="text"
                    class="timer-input"
                    @keyup.enter="saveManualTimer"
                    @blur="cancelEditManualTimer"
                />
                <div class="timer-controls">
                    <button @click="toggleManualTimer" :class="['btn-timer', manualTimerRunning ? 'btn-pause' : 'btn-start']">
                        {{ manualTimerRunning ? 'Pause' : 'Start' }}
                    </button>
                    <button @click="resetManualTimer" class="btn-timer btn-reset">Reset</button>
                </div>
            </div>
        </div>

        <div class="dashboard" v-if="config">
            <!-- Dynamically render panels based on config -->
            <template v-for="panel in sortedPanels" :key="panel.id">

                <!-- Timer -->
                <div v-if="panel.type === 'timer'" class="panel">
                    <h2>{{ panel.title }}</h2>
                    <div class="stage-indicator">
                        <div class="stage-value">{{ formatTimer(getCurrentValue(panel.fields[0])) }}</div>
                    </div>
                </div>

                <!-- Indicator (e.g., Flight Stage) -->
                <div v-else-if="panel.type === 'indicator'" class="panel">
                    <h2>{{ panel.title }}</h2>
                    <div class="stage-indicator">
                        <div class="stage-value">{{ formatValue(getCurrentValue(panel.fields[0]), panel.precision) }}</div>
                        <div v-if="panel.mapping" class="stage-name">{{ getStageName(getCurrentValue(panel.fields[0])) }}</div>
                    </div>
                </div>

                <!-- Chart -->
                <div v-else-if="panel.type === 'chart'" class="panel chart-panel" @click="openModal(panel)">
                    <h2>{{ panel.title }}</h2>
                    <canvas :id="`chart-${panel.id}`"></canvas>
                    <div class="current-value">{{ formatValue(getCurrentValue(panel.fields[0]), panel.precision) }} {{ panel.unit }}</div>
                </div>

                <!-- Boolean Grid (e.g., Continuity) -->
                <div v-else-if="panel.type === 'boolean_grid'" class="panel">
                    <h2>{{ panel.title }}</h2>
                    <div class="continuity-grid">
                        <div v-for="item in panel.items" :key="item.field"
                             :class="['continuity-indicator', getContinuityClass(item.field)]">
                            {{ item.label }}
                        </div>
                    </div>
                </div>

            </template>
        </div>

        <!-- Loading state -->
        <div v-else class="dashboard">
            <div class="panel">
                <h2>Loading Configuration...</h2>
            </div>
        </div>

        <!-- Chart Modal -->
        <div v-if="modalChart.visible" class="chart-modal" @mousedown.self="closeModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>{{ modalChart.title }}</h2>
                    <div class="modal-controls">
                        <button class="btn-reset-zoom" @click.stop="resetZoom" title="Reset Zoom">Reset Zoom</button>
                        <button class="modal-close" @click="closeModal">&times;</button>
                    </div>
                </div>
                <div class="modal-chart-container">
                    <canvas id="modal-chart"></canvas>
                </div>
                <div class="modal-footer">
                    <span class="modal-value">{{ formatValue(modalChart.currentValue, modalChart.precision) }} {{ modalChart.unit }}</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
