syntax = "proto3";

package rocket_telemetry;

// TelemetryPacket matches the exact fields from the CSV format for easy migration.
message TelemetryPacket {
  // 1. Time (0)
  uint32 cur_time = 1;

  // 2. GPS (1-3)
  int32 gps_lat = 2;
  int32 gps_lng = 3;
  int32 gps_alt = 4;

  // 3. IMU (4-10)
  float accel_x = 5;  // accel[0]
  float accel_y = 6;
  float accel_z = 7;
  float gyro_x = 8;
  float gyro_y = 9;
  float gyro_z = 10;
  float hg_accel = 11; // hg_accel[0]

  // 4. Flight Data (11-16)
  float alt_baro = 12; // alt[0]
  float vel_vertical = 13; // vel[0]
  float smooth_vel = 14;
  float press = 15;
  float temp = 16;
  float launchsite_msl = 17;

  // 5. Servos & Continuity (17-23)
  bool airbrake_cont = 18;
  float ab_servo_pct = 19;
  float cnrd_servo_pct = 20;
  bool drogue_pyro_cont_1 = 21;
  bool drogue_pyro_cont_2 = 22;
  bool main_pyro_cont_1 = 23;
  bool main_pyro_cont_2 = 24;

  // 6. State & Status (24-28)
  int32 flight_index = 25;
  bool ellipse_on = 26;
  bool cameras_on = 27;
  float battery_voltage = 28;
  int32 flight_stage = 29;
}
